<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">What Memory Mirror looks for</title>
  <desc id="d">Eleven categories: secrets and credentials, government IDs, health, special categories, money, location, other people, contact details, work, identity and your own watch words, each with a masked example.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1636"/><stop offset="1" stop-color="#0f0d1d"/></linearGradient>
    <style>
      .t{font:700 19px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#f5f2ff}
      .w{font:600 12px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.5px}
      .e{font:14px Consolas,'SF Mono',monospace;fill:#cfc9ea}
      .s{font:13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#a8a2c6}
      .i{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      .card{fill:#1b1832;stroke:#ffffff;stroke-opacity:.08}
    </style>
  </defs>
  <rect width="1200" height="560" rx="26" fill="url(#bg)"/>
  <text x="48" y="64" fill="#f7a1c4" class="w">ELEVEN CATEGORIES · 53 DETECTORS · ~300 TERMS</text>
  <text x="48" y="100" fill="#f5f2ff" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="32" font-weight="600">What Memory Mirror looks for</text>

  <g transform="translate(48 130)">
    <rect class="card" width="264" height="118" rx="16"/><rect width="264" height="4" rx="2" fill="#ff8a8a"/>
    <g transform="translate(20 22)" stroke="#ff8a8a" class="i"><path d="M8 11V8a4 4 0 1 1 8 0v3M6 11h12v9H6z"/></g>
    <text x="56" y="40" class="t">Secrets</text><text x="20" y="74" class="e">sk-p••••••••••••</text><text x="20" y="98" class="s">API keys, tokens, passwords</text>
  </g>
  <g transform="translate(328 130)">
    <rect class="card" width="264" height="118" rx="16"/><rect width="264" height="4" rx="2" fill="#ffb38a"/>
    <g transform="translate(20 22)" stroke="#ffb38a" class="i"><path d="M4 6h16v12H4zM8 10h3M8 14h6M15 10h2"/></g>
    <text x="56" y="40" class="t">Government IDs</text><text x="20" y="74" class="e">•••••6789</text><text x="20" y="98" class="s">SSN, national ID, passport</text>
  </g>
  <g transform="translate(608 130)">
    <rect class="card" width="264" height="118" rx="16"/><rect width="264" height="4" rx="2" fill="#f7a1c4"/>
    <g transform="translate(20 22)" stroke="#f7a1c4" class="i"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></g>
    <text x="56" y="40" class="t">Health</text><text x="20" y="74" class="e">s•••••••• · a••••••</text><text x="20" y="98" class="s">Conditions, medication, therapy</text>
  </g>
  <g transform="translate(888 130)">
    <rect class="card" width="264" height="118" rx="16"/><rect width="264" height="4" rx="2" fill="#d79bff"/>
    <g transform="translate(20 22)" stroke="#d79bff" class="i"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></g>
    <text x="56" y="40" class="t">Special categories</text><text x="20" y="74" class="e">My v••• · my l•••••</text><text x="20" y="98" class="s">Belief, politics, visa, legal</text>
  </g>

  <g transform="translate(48 264)">
    <rect class="card" width="264" height="118" rx="16"/><rect width="264" height="4" rx="2" fill="#ffd479"/>
    <g transform="translate(20 22)" stroke="#ffd479" class="i"><path d="M4 7h16v10H4zM4 11h16M8 15h3"/></g>
    <text x="56" y="40" class="t">Money</text><text x="20" y="74" class="e">GB82 •••••••• 5432</text><text x="20" y="98" class="s">IBANs, cards, income, debt</text>
  </g>
  <g transform="translate(328 264)">
    <rect class="card" width="264" height="118" rx="16"/><rect width="264" height="4" rx="2" fill="#8ee6b8"/>
    <g transform="translate(20 22)" stroke="#8ee6b8" class="i"><path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11zm0-8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></g>
    <text x="56" y="40" class="t">Location</text><text x="20" y="74" class="e">P••••••••••••••n</text><text x="20" y="98" class="s">Addresses, city, coordinates</text>
  </g>
  <g transform="translate(608 264)">
    <rect class="card" width="264" height="118" rx="16"/><rect width="264" height="4" rx="2" fill="#b9a6ff"/>
    <g transform="translate(20 22)" stroke="#b9a6ff" class="i"><path d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm7 0a2.5 2.5 0 1 0 0-5M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 14c2.8 0 5 2.2 5 5"/></g>
    <text x="56" y="40" class="t">Other people</text><text x="20" y="74" class="e">daughter M••• · mom L•••</text><text x="20" y="98" class="s">Family, friends, colleagues</text>
  </g>
  <g transform="translate(888 264)">
    <rect class="card" width="264" height="118" rx="16"/><rect width="264" height="4" rx="2" fill="#9fc3ff"/>
    <g transform="translate(20 22)" stroke="#9fc3ff" class="i"><path d="M4 6h16v12H4zM4 7l8 6 8-6"/></g>
    <text x="56" y="40" class="t">Contact details</text><text x="20" y="74" class="e">j••••@e•••.com</text><text x="20" y="98" class="s">Emails and phone numbers</text>
  </g>

  <g transform="translate(48 398)">
    <rect class="card" width="264" height="118" rx="16"/><rect width="264" height="4" rx="2" fill="#c8d48a"/>
    <g transform="translate(20 22)" stroke="#c8d48a" class="i"><path d="M4 8h16v11H4zM9 8V5h6v3M4 13h16"/></g>
    <text x="56" y="40" class="t">Work</text><text x="20" y="74" class="e">B••••••••••••••s</text><text x="20" y="98" class="s">Employer, title, NDA material</text>
  </g>
  <g transform="translate(328 398)">
    <rect class="card" width="264" height="118" rx="16"/><rect width="264" height="4" rx="2" fill="#f0c3a4"/>
    <g transform="translate(20 22)" stroke="#f0c3a4" class="i"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></g>
    <text x="56" y="40" class="t">Identity</text><text x="20" y="74" class="e">J••••••••••y · 34</text><text x="20" y="98" class="s">Name, age, date of birth</text>
  </g>
  <g transform="translate(608 398)">
    <rect class="card" width="264" height="118" rx="16"/><rect width="264" height="4" rx="2" fill="#7fd8ff"/>
    <g transform="translate(20 22)" stroke="#7fd8ff" class="i"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zm10 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></g>
    <text x="56" y="40" class="t">Your watch words</text><text x="20" y="74" class="e">N••••••r</text><text x="20" y="98" class="s">Codenames, a child's name…</text>
  </g>
  <g transform="translate(888 398)">
    <rect width="264" height="118" rx="16" fill="none" stroke="#f7a1c4" stroke-opacity=".55" stroke-dasharray="6 6"/>
    <text x="24" y="48" fill="#f7a1c4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Checksum-validated</text>
    <text x="24" y="74" class="s">Luhn · IBAN MOD 97 · T.C. Kimlik</text>
    <text x="24" y="96" class="s">SSN ranges · first-person context</text>
  </g>
</svg>
